# Qdrant Configuration for DEV_BBAK RAG Service

storage:
  # Storage path inside container
  storage_path: /qdrant/storage

service:
  # HTTP API configuration
  http:
    host: 0.0.0.0
    port: 6333
    cors:
      allow_origins: ["*"]
      allow_methods: ["GET", "POST", "PUT", "DELETE", "OPTIONS"]
      allow_headers: ["*"]

  # gRPC API configuration
  grpc:
    host: 0.0.0.0
    port: 6334

# Performance settings
performance:
  # Search optimization
  max_search_threads: 4
  max_searches_per_thread: 100

  # Memory settings
  max_segment_size_mb: 512
  segment_search_k: 10

  # Optimization thresholds
  search_threshold: 0.8
  indexing_threshold: 20000

# Logging configuration
log_level: INFO

# Cluster settings (single node for now)
cluster:
  enabled: false

# Telemetry (disable for privacy)
telemetry_disabled: true