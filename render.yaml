# Render deployment configuration for RAG Gateway
# https://render.com/docs/yaml-spec

services:
  # RAG Gateway Web Service
  - type: web
    name: rag-gateway
    runtime: node
    rootDir: apps/rag-gateway
    buildCommand: pnpm build
    startCommand: pnpm start

    # Health check (web service only)
    healthCheckPath: /api/admin/health

    # Build filters - only redeploy when RAG Gateway files change
    buildFilter:
      includedPaths:
        - apps/rag-gateway/**
        - packages/**
        - turbo.json
        - pnpm-lock.yaml
        - pnpm-workspace.yaml
      ignoredPaths:
        - apps/blog/**
        - apps/blog-admin/**

    # Environment variables (set these in Render dashboard)
    envVars:
      - key: NODE_ENV
        value: production

      # Qdrant Configuration
      - key: QDRANT_URL
        sync: false
      - key: QDRANT_COLLECTION_NAME
        value: claude-docs

      # API Keys
      - key: RAG_GATEWAY_API_KEY
        sync: false
      - key: GLM_API_KEY
        sync: false

      # Blog Admin URL (for blob files)
      - key: BLOG_ADMIN_URL
        sync: false

      # Redis (optional - for rate limiting)
      - key: REDIS_URL
        sync: false

      # Port (Render sets PORT automatically)
      - key: PORT
        value: 3002

    # Auto-deploy on main branch push
    branch: main
