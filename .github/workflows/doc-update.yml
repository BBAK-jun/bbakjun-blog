name: Auto Documentation Update

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      force_update:
        description: 'Force full documentation update (skip incremental check)'
        required: false
        type: boolean
        default: false

permissions:
  contents: write
  pull-requests: write

jobs:
  detect-changes:
    name: Detect Code Changes
    runs-on: ubuntu-latest
    outputs:
      has_changes: ${{ steps.diff.outputs.has_changes }}
      target_apps: ${{ steps.diff.outputs.target_apps }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect code changes
        id: diff
        run: |
          # Skip if this is a commit from doc automation PR
          if git log -1 --pretty=%B | grep -q "^docs: automated documentation update"; then
            echo "This is a doc automation commit, skipping..."
            echo "has_changes=false" >> $GITHUB_OUTPUT
            exit 0
          fi

          # Find latest documentation tag
          LATEST_DOC_TAG=$(git tag -l "docs/update-*" | sort -V | tail -1 || echo "")

          if [ -n "$LATEST_DOC_TAG" ]; then
            echo "Found latest doc tag: $LATEST_DOC_TAG"
            PREVIOUS_COMMIT=$(git rev-list -1 $LATEST_DOC_TAG)
          else
            echo "No doc tag found, using HEAD~1"
            PREVIOUS_COMMIT=$(git rev-parse HEAD~1)
          fi

          # Detect changed files (excluding .claude/docs/ and .github/)
          CHANGED_FILES=$(git diff --name-only ${PREVIOUS_COMMIT}...HEAD | grep -v -E '^(\\.claude/docs/|\\.github/)' || echo "")
          CHANGED_COUNT=$(echo "$CHANGED_FILES" | grep -c . || echo "0")

          echo "Previous commit: ${PREVIOUS_COMMIT}"
          echo "Changed files count: ${CHANGED_COUNT}"
          echo "${CHANGED_FILES}"

          if [ "${CHANGED_COUNT}" -gt "0" ] || [ "${{ github.event.inputs.force_update }}" = "true" ]; then
            echo "has_changes=true" >> $GITHUB_OUTPUT

            # Detect which apps changed
            TARGET_APPS=""

            # Check if apps/blog changed
            if echo "$CHANGED_FILES" | grep -q "^apps/blog/"; then
              TARGET_APPS="${TARGET_APPS}blog,"
            fi

            # Check if apps/blog-admin changed
            if echo "$CHANGED_FILES" | grep -q "^apps/blog-admin/"; then
              TARGET_APPS="${TARGET_APPS}blog-admin,"
            fi

            # Check if rag-gateway exists and changed
            if [ -d "apps/rag-gateway" ] && echo "$CHANGED_FILES" | grep -q "^apps/rag-gateway/"; then
              TARGET_APPS="${TARGET_APPS}rag-gateway,"
            fi

            # Check if shared packages changed
            if echo "$CHANGED_FILES" | grep -q "^packages/"; then
              TARGET_APPS="${TARGET_APPS}all"
            fi

            # Default to all if no specific apps detected
            if [ -z "$TARGET_APPS" ]; then
              TARGET_APPS="all"
            fi

            # Remove trailing comma
            TARGET_APPS=$(echo "$TARGET_APPS" | sed 's/,$//')
            echo "target_apps=${TARGET_APPS}" >> $GITHUB_OUTPUT
          else
            echo "has_changes=false" >> $GITHUB_OUTPUT
            echo "target_apps=" >> $GITHUB_OUTPUT
          fi

          # Remove old outputs that are no longer needed
          echo "changed_files=" >> $GITHUB_OUTPUT
          echo "previous_main=" >> $GITHUB_OUTPUT
          echo "base_commit=" >> $GITHUB_OUTPUT

  update-documentation:
    name: Update Documentation
    runs-on: ubuntu-latest
    needs: detect-changes
    if: needs.detect-changes.outputs.has_changes == 'true'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.25.0

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run documentation update
        env:
          ZAI_API_KEY: ${{ secrets.ZAI_API_KEY }}
          ZAI_API_BASE: ${{ secrets.ZAI_API_BASE || 'https://open.bigmodel.cn/api/paas/v4/' }}
          TARGET_APPS: ${{ needs.detect-changes.outputs.target_apps }}
          FORCE_UPDATE: ${{ github.event.inputs.force_update || 'false' }}
        run: |
          # Run the orchestration script (finds latest doc tag automatically)
          node .github/scripts/run-documentation-update.js

      - name: Check for documentation changes
        id: check_docs
        run: |
          if [ -d ".claude/docs" ] && [ "$(git -C .claude/docs status --porcelain | wc -l)" -gt "0" ]; then
            echo "has_doc_changes=true" >> $GITHUB_OUTPUT
            git -C .claude/docs status --porcelain
          else
            echo "has_doc_changes=false" >> $GITHUB_OUTPUT
          fi

      - name: Create Pull Request
        if: steps.check_docs.outputs.has_doc_changes == 'true'
        uses: peter-evans/create-pull-request@v7
        with:
          token: ${{ secrets.GH_PAT || secrets.GITHUB_TOKEN }}
          title: 'docs: automated documentation update [skip ci]'
          body: |
            ## 자동 생성된 문서 업데이트

            이 PR은 main 브랜치에 머지된 코드 변경사항을 기반으로 자동 생성되었습니다.

            ### 변경된 앱
            ${{ needs.detect-changes.outputs.target_apps }}

            ### 생성된 문서
            - `.claude/docs/facts/` - 코드베이스 구조 및 기술적 세부사항
            - `.claude/docs/insights/` - 비즈니스 컨텍스트 및 도메인 분석
            - `.claude/docs/specs/` - 기능 명세서

            ### 태그 기반 증분 업데이트
            - 이전 문서 업데이트 태그에서 현재 HEAD까지의 변경사항만 반영
            - PR 머지 시 새로운 `docs/update-{run_number}-{timestamp}` 태그가 생성됩니다

            ---
            🤖 Generated by [Claude Code](https://claude.com/claude-code)
          branch: docs/auto-update-${{ github.run_number }}
          delete-branch: true
          commit-message: 'docs: automated documentation update'
          labels: documentation, automated
          draft: false
