name: Create Documentation Tag

on:
  pull_request:
    types:
      - closed
    branches:
      - main

permissions:
  contents: write

jobs:
  create-doc-tag:
    name: Create Documentation Tag
    # Only run when PR is merged and has 'automated' label
    if: >
      github.event.pull_request.merged == true &&
      contains(github.event.pull_request.labels.*.name, 'automated')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Create documentation tag
        run: |
          # Tag format: docs/update-{run_number}-{timestamp}
          TAG_NAME="docs/update-${{ github.run_number }}-$(date +%s)"

          # Create annotated tag with PR info
          git tag -a "${TAG_NAME}" \
            -m "Documentation Update

          PR: #${{ github.event.pull_request.number }}
          Title: ${{ github.event.pull_request.title }}
          Merged by: ${{ github.event.pull_request.merged_by.login }}
          Run: ${{ github.run_number }}

          🤖 Generated by [Claude Code](https://claude.com/claude-code)"

          # Push tag to repository
          git push origin "${TAG_NAME}"

          echo "Created tag: ${TAG_NAME}"
